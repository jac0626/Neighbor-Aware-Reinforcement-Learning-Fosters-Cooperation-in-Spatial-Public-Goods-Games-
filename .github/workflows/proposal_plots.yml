name: Generate Proposal Plots

on:
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dqn_lambda: [0.0, 0.1, 0.3, 0.5]
        r_chunk: [A, B, C, D]
      fail-fast: false
      
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Run Simulation (Max Parallelism)
      run: |
        # Map chunk ID to r values
        # Total r range: 2.0 to 4.4 (13 values)
        # Split into 4 chunks to fit 4-core runners (3-4 sims per runner)
        
        case ${{ matrix.r_chunk }} in
          A) R_VALUES="2.0 2.2 2.4 2.6" ;;
          B) R_VALUES="2.8 3.0 3.2 3.4" ;;
          C) R_VALUES="3.6 3.8 4.0 4.2" ;;
          D) R_VALUES="4.4" ;;
        esac
        
        echo "Running chunk ${{ matrix.r_chunk }} with r values: $R_VALUES"
        
        python run_experiment.py \
          --r $R_VALUES \
          --dqn_lambda ${{ matrix.dqn_lambda }} \
          --iterations 100000 \
          --state_type reputation \
          --parallel \
          --output_dir results
          
    - name: Upload Results
      uses: actions/upload-artifact@v4
      with:
        name: results-lam${{ matrix.dqn_lambda }}-chunk${{ matrix.r_chunk }}
        path: results/

  plot:
    needs: simulate
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: all_results
        
    - name: Generate Plots
      run: |
        python src/visualization/plot_proposal.py
        
    - name: Upload Proposal Plots
      uses: actions/upload-artifact@v4
      with:
        name: proposal-plots
        path: proposal_plots/
