name: Generate Proposal Plots

on:
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dqn_lambda: [0.0, 0.1, 0.3, 0.5]
      fail-fast: false
      
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Run Simulation (Multi-Core)
      run: |
        # 4-Core Runner Optimization
        # We run a fine-grained sweep of r values in parallel on this runner.
        # r range: 2.0 to 4.4 (step 0.2) -> 13 simulations
        # With 4 cores, this will take ~4 batches.
        
        python run_experiment.py \
          --r 2.0 2.2 2.4 2.6 2.8 3.0 3.2 3.4 3.6 3.8 4.0 4.2 4.4 \
          --dqn_lambda ${{ matrix.dqn_lambda }} \
          --iterations 100000 \
          --state_type reputation \
          --parallel \
          --output_dir results
          
    - name: Upload Results
      uses: actions/upload-artifact@v4
      with:
        name: results-lam${{ matrix.dqn_lambda }}
        path: results/

  plot:
    needs: simulate
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: all_results
        
    - name: Generate Plots
      run: |
        python src/visualization/plot_proposal.py
        
    - name: Upload Proposal Plots
      uses: actions/upload-artifact@v4
      with:
        name: proposal-plots
        path: proposal_plots/
