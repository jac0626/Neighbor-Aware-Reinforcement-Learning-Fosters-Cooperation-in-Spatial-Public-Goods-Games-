name: Generate Proposal Plots

on:
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        r: [2.5, 3.0, 3.5, 4.0]
        dqn_lambda: [0.0, 0.1, 0.3, 0.5]
      fail-fast: false
      
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Run Simulation
      run: |
        # Use smaller grid and fewer iterations for speed
        # L=30, Iterations=100000
        # Modify config.py on the fly or pass args if supported
        # We don't have L arg exposed, but 50x50 is fine for 100000 iters.
        # Let's stick to default L=50 but reduce iterations.
        
        python run_experiment.py \
          --r ${{ matrix.r }} \
          --dqn_lambda ${{ matrix.dqn_lambda }} \
          --iterations 100000 \
          --state_type reputation \
          --output_dir results
          
    - name: Upload Results
      uses: actions/upload-artifact@v4
      with:
        name: results-r${{ matrix.r }}-lam${{ matrix.dqn_lambda }}
        path: results/

  plot:
    needs: simulate
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: all_results
        
    - name: Generate Plots
      run: |
        python src/visualization/plot_proposal.py
        
    - name: Upload Proposal Plots
      uses: actions/upload-artifact@v4
      with:
        name: proposal-plots
        path: proposal_plots/
